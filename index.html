<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>roughMaps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header class="intro">
        <h1>rough<span>Maps</span></h1>
        <p>Turn any place into a hand-drawn map, right in your browser.</p>
      </header>

      <section class="workspace">
        <div id="controls" class="controls">
          <form id="search-form" class="search">
            <input id="search" type="search" placeholder="Search a place" autocomplete="off" />
            <button type="submit">Go</button>
          </form>
          <p id="search-status" class="note"></p>
          <ul id="search-results" class="results"></ul>
          <label for="style">Style</label>
          <select id="style"></select>
          <p id="style-note" class="note"></p>
          <label for="fill-style">Fill style</label>
          <select id="fill-style">
            <option value="default">Style default</option>
            <option value="hachure">Hachure</option>
            <option value="solid">Solid</option>
            <option value="cross-hatch">Cross-hatch</option>
            <option value="dashed">Dashed</option>
            <option value="zigzag">Zigzag</option>
            <option value="zigzag-line">Zigzag line</option>
            <option value="dots">Dots</option>
          </select>
          <label>Roughness: <span data-value="roughness">1</span></label>
          <wired-slider data-setting="roughness" min="0" max="5" step="0.25" value="1"></wired-slider>
          <label>strokeWidth: <span data-value="strokeWidth">1</span></label>
          <wired-slider data-setting="strokeWidth" min="0" max="5" step="0.25" value="1"></wired-slider>
          <label>innerStrokeWidth: <span data-value="innerStrokeWidth">1</span></label>
          <wired-slider data-setting="innerStrokeWidth" min="0" max="3" step="0.25" value="1"></wired-slider>
          <label>fillWeight: <span data-value="fillWeight">1</span></label>
          <wired-slider data-setting="fillWeight" min="0" max="3" step="0.1" value="1"></wired-slider>
          <div class="toggles">
            <wired-checkbox data-setting="labels" checked>Labels</wired-checkbox>
            <wired-checkbox data-setting="doodles" checked>Doodles</wired-checkbox>
          </div>
          <button id="sketch-button" type="button">Sketch it</button>
          <button id="back-button" type="button" hidden>Back to map</button>
        </div>
        <div id="stage" class="stage">
          <div id="picker"></div>
          <canvas id="map" hidden></canvas>
        </div>
      </section>

      <footer>
        Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>
        · <a href="https://github.com/ACoci86/roughMaps" target="_blank" rel="noopener">GitHub</a>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
